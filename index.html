<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA_UM_contact · 全国高校一览 · 硕士招生目标院校</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --c985: #dc2626;
    --c211: #ea580c;
    --cfirst: #16a34a;
    --cnon: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .stat { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 14px; }
  header .stat b { color: var(--primary); font-size: 16px; }

  .tabs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .tabs .tier-group {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .tabs .prov-group {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .tabs .tab {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    transition: all .15s;
    user-select: none;
    white-space: nowrap;
  }
  .tabs .tab:hover { border-color: var(--primary); color: var(--primary); background: #f5f9ff; }
  .tabs .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .tabs .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
  .tabs .prov-group .tab { padding: 5px 14px; font-size: 12.5px; }
  .tabs .group-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 4px; flex-shrink: 0; }
  .tabs .region-tag {
    font-size: 12px; color: #8b5e3c; font-weight: 700;
    background: #fdf6ec; border: 1px solid #f0e0c8;
    padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
  }

  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 320px; min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar .search { padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar .search input {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; outline: none;
  }
  .sidebar .search input:focus { border-color: var(--primary); }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .list-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background .12s;
  }
  .list-item:hover { background: #f0f4ff; }
  .list-item.active { background: #e0eaff; box-shadow: inset 3px 0 0 var(--primary); }
  .list-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .meta { font-size: 12px; color: var(--muted); }
  .list-item .badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; color: #fff; font-weight: 600; flex-shrink: 0; }

  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  .detail {
    position: absolute; top: 16px; right: 16px;
    width: 340px; max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 16px; display: none; z-index: 1000;
  }
  .detail.show { display: block; }
  .detail .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  .detail h3 { font-size: 16px; margin-bottom: 2px; padding-right: 20px; }
  .detail .tier-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; margin: 6px 0 10px; }
  .detail .row { font-size: 13px; margin: 5px 0; color: var(--muted); }
  .detail .row .k { display: inline-block; width: 70px; flex-shrink: 0; font-weight: 600; color: var(--text); }

  /* 部门区块 */
  .dept-block { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .dept-block h4 { font-size: 13px; color: var(--primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .dept-block .durl { font-size: 12.5px; word-break: break-all; margin: 3px 0; }
  .dept-block .durl a { color: var(--primary); text-decoration: none; }
  .dept-block .durl a:hover { text-decoration: underline; }
  .dept-block .wechat { font-size: 12.5px; color: var(--accent, #0a8f5c); background: #f0faf5; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-top: 2px; }
  .dept-block .contact { font-size: 12.5px; color: #374151; margin-top: 4px; word-break: break-all; }
  .dept-block .contact b { color: var(--muted); font-weight: 500; }
  .dept-block .null-tag { font-size: 12px; color: #9ca3af; font-style: italic; }

  .legend {
    position: absolute; bottom: 20px; left: 16px;
    background: rgba(255,255,255,.95); border-radius: 8px;
    padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    font-size: 12px; z-index: 900;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }

  header .dl-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 18px;
    background: var(--primary); color: #fff;
    font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    transition: opacity .15s; position: relative;
  }
  header .dl-btn:hover { opacity: .85; }
  header .dl-btn.outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  header .dl-btn .new-badge {
    position: absolute; top: -7px; right: -7px;
    background: #e11d48; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 3px 5px; border-radius: 8px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
</style>
</head>
<body>
<header>
  <h1>全国高校一览</h1>
  <span class="sub">澳门大学 · 信息学院 & 工学院 硕士招生目标院校</span>
  <div class="stat" id="stat"></div>
  <a class="dl-btn" id="dl-summary" href="dataset/全国重点院校/全国高校汇总表.xlsx" download>
    下载汇总表<span class="new-badge" id="new-summary" style="display:none">new!</span>
  </a>
  <a class="dl-btn outline" id="dl-update" href="dataset/全国重点院校/更新部分.csv" download>
    下载更新部分<span class="new-badge" id="new-update" style="display:none">new!</span>
  </a>
</header>

<div class="tabs" id="tabs">
  <div class="tier-group">
    <span class="tab active" data-p="all">全部</span>
    <span class="sep"></span>
    <span class="tab" data-t="985">985</span>
    <span class="tab" data-t="211">211</span>
    <span class="tab" data-t="双一流">双一流</span>
    <span class="tab" data-t="双非">双非</span>
  </div>
  <div class="prov-group" id="prov-tabs">
    <span class="group-label">省份</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="search">
      <input type="text" id="search" placeholder="搜索高校名称 / 城市 / 部门..." />
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="detail" id="detail">
      <span class="close" onclick="closeDetail()">×</span>
      <h3 id="d-name"></h3>
      <span class="tier-tag" id="d-tier"></span>
      <div class="row"><span class="k">省份</span><span id="d-province"></span></div>
      <div class="row"><span class="k">城市</span><span id="d-city"></span></div>
      <div class="row"><span class="k">层次</span><span id="d-level"></span></div>
      <div class="row"><span class="k">性质</span><span id="d-type"></span></div>
      <div class="row"><span class="k">主管</span><span id="d-dept"></span></div>
      <div class="row"><span class="k">官网</span><span id="d-web"></span></div>
      <div id="d-depts"></div>
    </div>
    <div class="legend">
      <div class="item"><span class="dot" style="background:var(--c985)"></span> 985</div>
      <div class="item"><span class="dot" style="background:var(--c211)"></span> 211</div>
      <div class="item"><span class="dot" style="background:var(--cfirst)"></span> 双一流</div>
      <div class="item"><span class="dot" style="background:var(--cnon)"></span> 双非</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TIER_COLOR = { '985': '#dc2626', '211': '#ea580c', '双一流': '#16a34a', '双非': '#64748b' };
const DEPT_LABEL = { 'career': '就业中心', 'grad': '研究生院', 'intl': '国际处' };
const DEPT_ORDER = ['career', 'grad', 'intl'];

let ALL = [];
let currentFilter = { p: 'all', t: null };
let searchText = '';
let markers = {};
let map, markerLayer;
let activeName = null;

function initMap() {
  map = L.map('map').setView([35.5, 105.0], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

// 省份简称映射
const PROV_SHORT = {
  '北京市': '北京', '天津市': '天津', '上海市': '上海', '重庆市': '重庆',
  '广东省': '广东', '吉林省': '吉林', '辽宁省': '辽宁', '黑龙江省': '黑龙江',
  '江苏省': '江苏', '浙江省': '浙江', '安徽省': '安徽', '福建省': '福建',
  '江西省': '江西', '山东省': '山东', '河南省': '河南', '湖北省': '湖北',
  '湖南省': '湖南', '四川省': '四川', '贵州省': '贵州', '云南省': '云南',
  '陕西省': '陕西', '甘肃省': '甘肃', '青海省': '青海', '海南省': '海南',
  '河北省': '河北', '山西省': '山西',
  '广西壮族自治区': '广西', '内蒙古自治区': '内蒙古', '宁夏回族自治区': '宁夏',
  '新疆维吾尔自治区': '新疆', '西藏自治区': '西藏',
};

// 国家党政机关六大行政区分类
const PROV_REGION = {
  '华北': ['北京市', '天津市', '河北省', '山西省', '内蒙古自治区'],
  '东北': ['辽宁省', '吉林省', '黑龙江省'],
  '华东': ['上海市', '江苏省', '浙江省', '安徽省', '福建省', '江西省', '山东省'],
  '中南': ['河南省', '湖北省', '湖南省', '广东省', '广西壮族自治区', '海南省'],
  '西南': ['重庆市', '四川省', '贵州省', '云南省', '西藏自治区'],
  '西北': ['陕西省', '甘肃省', '青海省', '宁夏回族自治区', '新疆维吾尔自治区'],
};
const REGION_ORDER = ['华北', '东北', '华东', '中南', '西南', '西北'];

function buildProvTabs() {
  const container = document.getElementById('prov-tabs');
  const provSet = new Set(ALL.map(u => u.province).filter(Boolean));
  let html = '<span class="group-label">省份</span>';

  REGION_ORDER.forEach(region => {
    const provs = PROV_REGION[region].filter(p => provSet.has(p));
    if (!provs.length) return;
    html += `<span class="region-tag">${region}</span>`;
    provs.forEach(p => {
      const short = PROV_SHORT[p] || p.replace('省', '').replace('市', '').replace('自治区', '').replace('壮族', '').replace('回族', '').replace('维吾尔', '');
      html += `<span class="tab" data-p="${p}">${short}</span>`;
    });
    html += '<span class="sep"></span>';
  });

  container.innerHTML = html;
}

function tierColor(t) { return TIER_COLOR[t] || '#64748b'; }

function renderMarkers(data) {
  markerLayer.clearLayers();
  markers = {};
  data.forEach(u => {
    if (u.lat == null || u.lon == null) return;
    const color = tierColor(u.tier);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:13px;height:13px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>`,
      iconSize: [13, 13], iconAnchor: [6, 6]
    });
    const m = L.marker([u.lat, u.lon], { icon }).addTo(markerLayer);
    m.on('click', () => selectUniv(u));
    m.bindTooltip(u.name, { direction: 'top', offset: [0, -8] });
    markers[u.name] = m;
  });
}

function renderList(data) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!data.length) { list.innerHTML = '<div class="empty">无匹配结果</div>'; return; }
  data.forEach(u => {
    const item = document.createElement('div');
    item.className = 'list-item' + (u.name === activeName ? ' active' : '');
    item.innerHTML = `
      <span class="dot" style="background:${tierColor(u.tier)}"></span>
      <div class="info">
        <div class="name">${u.name}</div>
        <div class="meta">${u.city} · ${u.tier}</div>
      </div>
      <span class="badge" style="background:${tierColor(u.tier)}">${u.tier}</span>
    `;
    item.onclick = () => selectUniv(u);
    list.appendChild(item);
  });
}

function renderDepts(u) {
  const el = document.getElementById('d-depts');
  const depts = u.depts;
  if (!depts) {
    el.innerHTML = '<div class="dept-block"><h4>部门渠道</h4><div class="null-tag">未抓取到部门数据 (null)</div></div>';
    return;
  }
  let html = '<div class="dept-block"><h4>部门渠道</h4>';
  DEPT_ORDER.forEach(k => {
    const v = depts[k];
    const label = DEPT_LABEL[k] || k;
    if (!v) {
      html += `<div style="margin:6px 0"><b>${label}：</b><span class="null-tag">null</span></div>`;
      return;
    }
    html += `<div style="margin:8px 0;padding:8px;background:#f8fafc;border-radius:8px"><b>${label}</b>`;
    if (v.url) {
      html += `<div class="durl"><a href="${v.url}" target="_blank">${v.url}</a></div>`;
    } else {
      html += `<div class="null-tag">null</div>`;
    }
    if (v.wechat) {
      html += `<div class="wechat">公众号：${v.wechat}</div>`;
    }
    if (v.email && v.email.length) {
      html += `<div class="contact"><b>邮箱：</b>${v.email.join('；')}</div>`;
    }
    if (v.phone && v.phone.length) {
      html += `<div class="contact"><b>电话：</b>${v.phone.join('；')}</div>`;
    }
    if (v.contact_note) {
      html += `<div class="contact" style="color:#c97b0a">⚠ ${v.contact_note}</div>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function applyFilter() {
  let data = ALL;
  if (currentFilter.p !== 'all') data = data.filter(u => u.province === currentFilter.p);
  if (currentFilter.t) data = data.filter(u => u.tier === currentFilter.t);
  if (searchText) {
    const kw = searchText.toLowerCase();
    data = data.filter(u => {
      if (u.name.toLowerCase().includes(kw) || u.city.toLowerCase().includes(kw)) return true;
      if (u.province && u.province.includes(kw)) return true;
      if (u.depts) {
        for (const v of Object.values(u.depts)) {
          if (!v) continue;
          if ((v.url||'').toLowerCase().includes(kw) ||
              (v.wechat||'').toLowerCase().includes(kw) ||
              (v.email||[]).some(e => e.toLowerCase().includes(kw)) ||
              (v.phone||[]).some(p => p.includes(kw)) ||
              (v.contact_note||'').includes(kw)) return true;
        }
      }
      return false;
    });
  }
  renderList(data);
  renderMarkers(data);
  updateStat(data);
  fitBounds(data);
}

function fitBounds(data) {
  const pts = data.filter(u => u.lat != null && u.lon != null).map(u => [u.lat, u.lon]);
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 12);
  else map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

function updateStat(data) {
  const counts = { '985': 0, '211': 0, '双一流': 0, '双非': 0 };
  data.forEach(u => counts[u.tier]++);
  document.getElementById('stat').innerHTML =
    `共 <b>${data.length}</b> 所 ` +
    `<span style="color:var(--c985)">985 ×${counts['985']}</span> ` +
    `<span style="color:var(--c211)">211 ×${counts['211']}</span> ` +
    `<span style="color:var(--cfirst)">双一流 ×${counts['双一流']}</span> ` +
    `<span style="color:var(--cnon)">双非 ×${counts['双非']}</span>`;
}

function selectUniv(u) {
  activeName = u.name;
  document.querySelectorAll('.list-item').forEach(el =>
    el.classList.toggle('active', el.querySelector('.name').textContent === u.name));
  document.getElementById('d-name').textContent = u.name;
  const tierEl = document.getElementById('d-tier');
  tierEl.textContent = u.tier;
  tierEl.style.background = tierColor(u.tier);
  document.getElementById('d-province').textContent = u.province;
  document.getElementById('d-city').textContent = u.city;
  document.getElementById('d-level').textContent = u.level;
  document.getElementById('d-type').textContent = u.school_type;
  document.getElementById('d-dept').textContent = u.department || '-';
  const webEl = document.getElementById('d-web');
  if (u.website) {
    webEl.innerHTML = `<a href="${u.website}" target="_blank">${u.website}</a>`;
    if (u.web_fail_reason) {
      webEl.innerHTML += `<span style="color:#c97b0a;font-size:12px"> (不可达：${u.web_fail_reason})</span>`;
    }
  } else {
    webEl.innerHTML = '-';
  }
  renderDepts(u);
  document.getElementById('detail').classList.add('show');
  if (u.lat != null && u.lon != null) map.setView([u.lat, u.lon], Math.max(map.getZoom(), 12));
}

function closeDetail() {
  document.getElementById('detail').classList.remove('show');
  activeName = null;
  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  if (tab.dataset.p !== undefined) { currentFilter.p = tab.dataset.p; currentFilter.t = null; }
  else if (tab.dataset.t !== undefined) { currentFilter.t = tab.dataset.t; currentFilter.p = 'all'; }
  document.querySelectorAll('.tab').forEach(t => {
    const on = (t.dataset.p !== undefined && t.dataset.p === currentFilter.p && !currentFilter.t) ||
              (t.dataset.t !== undefined && t.dataset.t === currentFilter.t);
    t.classList.toggle('active', on);
  });
  closeDetail();
  applyFilter();
});

document.getElementById('search').addEventListener('input', e => {
  searchText = e.target.value.trim();
  applyFilter();
});

fetch('dataset/index.json')
  .then(r => r.json())
  .then(data => { ALL = data; initMap(); buildProvTabs(); applyFilter(); })
  .catch(err => {
    document.getElementById('list').innerHTML = '<div class="empty">数据加载失败：' + err.message + '</div>';
  });

// 更新标注：读取 update_meta.json，计算相对时间（日/月），近期更新则显示 new!
function relativeTime(lastStr) {
  const last = new Date(lastStr.replace(' ', 'T'));
  const diffMs = Date.now() - last.getTime();
  const days = Math.floor(diffMs / 86400000);
  if (days < 1) {
    const hours = Math.floor(diffMs / 3600000);
    return hours < 1 ? '刚刚' : hours + '小时前';
  }
  if (days < 30) return days + '天前';
  const months = Math.floor(days / 30);
  return months + '个月前';
}

fetch('dataset/update_meta.json')
  .then(r => r.json())
  .then(meta => {
    const last = new Date(meta.last_update.replace(' ', 'T'));
    const days = Math.floor((Date.now() - last.getTime()) / 86400000);
    // new! 判定：30 天内视为近期更新
    if (days < 30) {
      document.getElementById('new-summary').style.display = 'inline';
      document.getElementById('new-update').style.display = 'inline';
    }
    const stat = document.getElementById('stat');
    stat.innerHTML += `<span style="color:#e11d48;font-weight:700"> · ${relativeTime(meta.last_update)}更新</span>`;
  })
  .catch(() => {});
</script>
</body>
</html>
