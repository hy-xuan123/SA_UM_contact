<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高校部门联系方式归属核验报告</title>
<style>
  :root { --brand:#1e5aa8; --ok:#16a34a; --warn:#c97b0a; --bad:#dc2626; --bg:#f6f8fb; --line:#e6eaf0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1a2333; line-height:1.6; }
  .wrap { max-width:1100px; margin:0 auto; padding:30px 24px 80px; }
  header { background:linear-gradient(135deg,#12294a,#1e5aa8); color:#fff; border-radius:14px; padding:28px 32px; margin-bottom:24px; }
  header h1 { font-size:24px; }
  header .sub { opacity:.9; font-size:14px; margin-top:8px; }
  .stat-card { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { flex:1; min-width:140px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .num { font-size:26px; font-weight:700; color:var(--brand); }
  .stat .label { font-size:13px; color:#5b6779; margin-top:4px; }
  .filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter { padding:6px 14px; border-radius:18px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; }
  .filter.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .row { display:flex; gap:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:8px; align-items:flex-start; }
  .badge { flex-shrink:0; font-size:11px; padding:2px 8px; border-radius:10px; color:#fff; font-weight:600; }
  .badge.ok { background:var(--ok); } .badge.warn { background:var(--warn); } .badge.bad { background:var(--bad); }
  .info { flex:1; min-width:0; }
  .info .school { font-weight:600; font-size:14px; }
  .info .dept { color:var(--brand); font-size:12px; font-weight:600; }
  .info .url { color:#5b6779; font-size:12px; word-break:break-all; margin:2px 0; }
  .info .contact { font-size:12.5px; color:#374151; margin-top:4px; }
  .info .contact b { color:#5b6779; font-weight:500; }
  .info .note { font-size:12px; color:var(--warn); margin-top:3px; }
  .legend { font-size:12.5px; color:#5b6779; background:#fff; border:1px solid var(--line); padding:10px 14px; border-radius:8px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>高校部门联系方式归属核验报告</h1>
  <div class="sub">核验每所高校 就业中心 / 研究生院 / 国际处 的电话与邮箱是否对应正确部门，广东 + 东北三省 157 所高校</div>
</header>

<div id="stats" class="stat-card"></div>
<div class="legend">
  <b>归属判定说明：</b>基于部门 URL 路径/域名特征自动判定联系方式来源。
  「可信」表示 URL 明确指向对应部门；「存疑-招生就业合并站」表示该站为招生+就业合并站点，联系方式可能属招生办而非纯就业中心；「需人工确认」表示无明确 URL 特征，需对照官网人工核实。
</div>
<div class="filters" id="filters">
  <span class="filter active" data-f="all">全部</span>
  <span class="filter" data-f="ok">可信</span>
  <span class="filter" data-f="warn">存疑-招生就业合并站</span>
  <span class="filter" data-f="manual">需人工确认</span>
</div>
<div id="list"></div>
</div>

<script>
let DATA = [];
let curFilter = 'all';

function classifyBadge(t) {
  if (t && t.startsWith('可信')) return ['ok', '可信'];
  if (t && t.startsWith('存疑')) return ['warn', '存疑'];
  return ['bad', '需人工确认'];
}

function render(data) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!data.length) { list.innerHTML = '<div style="text-align:center;color:#888;padding:40px">无数据</div>'; return; }
  data.forEach(x => {
    const [cls, label] = classifyBadge(x.source_type);
    let contact = '';
    if (x.email && x.email.length) contact += `<b>邮箱：</b>${x.email.join('；')}<br>`;
    if (x.phone && x.phone.length) contact += `<b>电话：</b>${x.phone.join('；')}`;
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `
      <span class="badge ${cls}">${label}</span>
      <div class="info">
        <span class="school">${x.school}</span> <span class="dept">${x.dept_label}</span>
        <div class="url">${x.url || ''}</div>
        <div class="contact">${contact || '<span style="color:#9ca3af">暂无联系方式</span>'}</div>
        ${x.note ? `<div class="note">⚠ ${x.note}</div>` : ''}
      </div>`;
    list.appendChild(el);
  });
}

function filter(f) {
  curFilter = f;
  document.querySelectorAll('.filter').forEach(el =>
    el.classList.toggle('active', el.dataset.f === f));
  if (f === 'all') render(DATA);
  else if (f === 'ok') render(DATA.filter(x => x.source_type.startsWith('可信')));
  else if (f === 'warn') render(DATA.filter(x => x.source_type.startsWith('存疑')));
  else render(DATA.filter(x => !x.source_type.startsWith('可信') && !x.source_type.startsWith('存疑')));
}

fetch('dataset/contact_audit.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    // 统计
    const ok = d.filter(x => x.source_type.startsWith('可信')).length;
    const warn = d.filter(x => x.source_type.startsWith('存疑')).length;
    const manual = d.filter(x => !x.source_type.startsWith('可信') && !x.source_type.startsWith('存疑')).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="num">${d.length}</div><div class="label">部门条目总数</div></div>
      <div class="stat"><div class="num" style="color:var(--ok)">${ok}</div><div class="label">归属可信</div></div>
      <div class="stat"><div class="num" style="color:var(--warn)">${warn}</div><div class="label">存疑-招生就业合并站</div></div>
      <div class="stat"><div class="num" style="color:var(--bad)">${manual}</div><div class="label">需人工确认</div></div>`;
    render(d);
  })
  .catch(e => document.getElementById('list').innerHTML = '<div style="padding:40px;color:red">加载失败：' + e.message + '</div>');

document.getElementById('filters').addEventListener('click', e => {
  if (e.target.classList.contains('filter')) filter(e.target.dataset.f);
});
</script>
</body>
</html>
